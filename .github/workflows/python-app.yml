name: Run Telegram Bot

on:
  workflow_dispatch:
  schedule:
    # كل 5 ساعات: التشغيل الجديد يلغي القديم تلقائيا فلا يحصل توقف
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
